};
// Inner walkable area per room
function innerRoom(r){return{x:r.x+WALL,y:r.y+WALL,w:r.w-WALL*2,h:r.h-WALL*2};}
// Doorway zones (player can pass through walls here)
const DOORWAYS = [
  {x:218,y:UI_H+65, w:24,h:95},   // bathroom ↔ entry
  {x:338,y:UI_H+55, w:24,h:105},  // entry ↔ baby
  {x:55, y:UI_H+188,w:100,h:14},  // bathroom → kitchen
  {x:255,y:UI_H+188,w:90, h:14},  // entry → kitchen
  {x:490,y:UI_H+188,w:160,h:14},  // baby → living
  {x:348,y:UI_H+300,w:24, h:120}, // kitchen ↔ living
];
function isWalkable(px,py,pw=18,ph=18){
  const mx=px+pw/2, my=py+ph/2;
  for(const r of Object.values(RM)){
    const ir=innerRoom(r);
    if(mx>ir.x&&mx<ir.x+ir.w&&my>ir.y&&my<ir.y+ir.h)return true;
  }
  for(const d of DOORWAYS){
    if(mx>d.x&&mx<d.x+d.w&&my>d.y&&my<d.y+d.h)return true;
  }
  return false;
}

// ── ROOM DRAWING ──────────────────────────────────
function drawRooms(){
  // Draw floors
  Object.entries(RM).forEach(([name,r])=>{
    const col=ROOM_COL[name];
    // Wall color (outer)
    cx.fillStyle=col.wall; cx.fillRect(r.x,r.y,r.w,r.h);
    // Floor (inner)
    const ir=innerRoom(r);
    cx.fillStyle=col.floor; cx.fillRect(ir.x,ir.y,ir.w,ir.h);
    // Room name (subtle)
    cx.font='10px monospace'; cx.fillStyle='rgba(0,0,0,0.25)';
    cx.textAlign='center';
    cx.fillText(['bathroom','entry'].includes(name)?'':
      name==='baby'?"Baby's Room":
      name==='kitchen'?'Kitchen':
      name==='living'?'Living Room':'',
      r.x+r.w/2, r.y+r.h/2+4);
  });

  // Draw doorway gaps (erase wall lines at doors)
  cx.fillStyle='#00000000';
  DOORWAYS.forEach(d=>{
    // Find floor color at center of doorway
    const mx=d.x+d.w/2, my=d.y+d.h/2;
    let col='#C4A472';
    for(const [name,r] of Object.entries(RM)){
      if(mx>r.x&&mx<r.x+r.w&&my>r.y&&my<r.y+r.h){col=ROOM_COL[name].floor;break;}
    }
    cx.fillStyle=col;
    cx.fillRect(d.x,d.y,d.w,d.h);
  });

  // Draw furniture
  drawFurniture();
}

  cx.fillStyle=PAL.baby.cheeks+'88';
  cx.beginPath();cx.ellipse(bx+6,by+13,5,4,0,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(bx+24,by+13,5,4,0,0,Math.PI*2);cx.fill();

  cx.fillStyle=PAL.baby.hair;
  for(let i=0;i<4;i++){cx.fillRect(bx+8+i*3,by,2,4+Math.sin(i)*2);}
  // Eyes & expression
  if(state==='cry'){
    cx.fillStyle='#333'; cx.fillRect(bx+8,by+10,3,3); cx.fillRect(bx+19,by+10,3,3);
    cx.font='8px serif'; cx.textAlign='center';

    // Tears
    cx.fillStyle='#88aaff';

    cx.fillStyle='#555'; cx.fillRect(bx+8,by+11,5,2); cx.fillRect(bx+18,by+11,5,2);
    cx.font='10px serif'; cx.textAlign='left'; cx.fillText('z z',bx+28,by+5);
  } else {
    // Happy
    cx.fillStyle='#333'; cx.fillRect(bx+8,by+10,3,3); cx.fillRect(bx+19,by+10,3,3);
    cx.fillStyle='#333';
    cx.beginPath();cx.arc(bx+15,by+16,4,0.1,Math.PI-0.1);cx.stroke();

  if(state==='cry'){
    cx.fillStyle=PAL.baby.skin;
    cx.fillRect(bx,by+20,8,5); cx.fillRect(bx+22,by+20,8,5);

  // Eyes

  cx.fillStyle='#fff'; cx.fillRect(29,6,1,1);

  // Tail
  cx.fillStyle=PAL.dog.body;

  cx.beginPath(); cx.moveTo(2,8); cx.quadraticCurveTo(-5,tailWag,0,tailWag+3); cx.lineWidth=4; cx.strokeStyle=PAL.dog.body; cx.stroke();

  cx.restore();
}

function drawCallout(tx,ty,ev,maxT){
  if(!ev)return;
  const timeLeft=ev.timer/maxT;
  const bw=180, bh=52;
  const bx=tx-bw/2, by=ty-bh-14;
  // Bubble
  drawRoundRect(bx,by,bw,bh,8,'rgba(255,248,240,0.97)','#c8a08030');
  // Tail
  cx.fillStyle='rgba(255,248,240,0.97)';
  cx.beginPath(); cx.moveTo(tx-6,by+bh); cx.lineTo(tx+6,by+bh); cx.lineTo(tx,ty-6); cx.closePath(); cx.fill();
  // Callout text

}

// ── EVENT SYSTEM ──────────────────────────────────
function getTimePhase(){
  if(gameTime<12*60) return 'morning';
  if(gameTime<18*60) return 'afternoon';
  return 'evening';
}
function spawnEvent(pool,character,maxActive){
  const existing=activeEvents.filter(e=>e.character===character);
  if(existing.length>=maxActive) return;
  const phase=getTimePhase();
  const eligible=pool.filter(def=>!activeEvents.find(e=>e.id===def.id)&&
    (def.trigger==='anytime'||def.trigger===phase));
  if(eligible.length===0) return;
  const def=eligible[rndI(0,eligible.length-1)];
  const maxT=rnd(def.minT,def.maxT);
  activeEvents.push({...def,character,timer:maxT,maxTimer:maxT});
  if(def.item==='groceries') ITEMS.groceries.avail=true;
}
function resolveEvent(ev){
  happiness=Math.min(100,happiness+ev.gain);
  activeEvents=activeEvents.filter(e=>e!==ev);
  if(ev.item==='groceries') ITEMS.groceries.avail=false;
  PLR.carrying=null;
  showFlash('✓ '+ev.calloutEn);
  // Baby happy feedback
  if(ev.character==='baby') BABY.state='happy';
}
function getEventForChar(char){
  return activeEvents.filter(e=>e.character===char).sort((a,b)=>a.timer-b.timer)[0]||null;
}

// ── INTERACTION ───────────────────────────────────
const INTERACT_RANGE=55;
function interact(){
  const px2=PLR.x+PLR.w/2, py2=PLR.y+PLR.h/2;

  // Night routine interaction
  if(nightActive&&nightStep<nightRoutine.length){
    const step=nightRoutine[nightStep];
    
    // Baby woke special case
    if(babyWoke&&!babyWokeHandled){
      if(dist({x:px2,y:py2},{x:BABY.x,y:BABY.y})<INTERACT_RANGE){
        babyWokeHandled=true; BABY.state='sleep';
        happiness=Math.min(100,happiness+10);
        showFlash('👶 아기를 달랬어요! 💕');
      }
      return;
    }
    
    // Check zone proximity
    let zoneOK=false;
    if(step.zone==='bathroom'&&isInRoom(px2,py2,'bathroom'))zoneOK=true;
    if(step.zone==='baby'&&isInRoom(px2,py2,'baby'))zoneOK=true;
    if(step.zone==='living'&&isInRoom(px2,py2,'living'))zoneOK=true;
    if(step.zone==='kitchen'&&isInRoom(px2,py2,'kitchen'))zoneOK=true;
    
    if(step.item&&!PLR.carrying){
      showFlash('💡 먼저 '+ITEMS[step.item].e+' '+ITEMS[step.item].name+'을/를 가져오세요!');
      return;
    }
    if(step.item&&PLR.carrying!==step.item){
      showFlash('💡 '+ITEMS[step.item].e+' '+ITEMS[step.item].name+'이/가 필요해요!');
      return;
    }
    if(!zoneOK){
      showFlash('💡 맞는 장소로 가서 행동하세요!');
      return;
    }
    
    // Complete step
    nightRoutine[nightStep].done=true;
    PLR.carrying=null;
    if(step.id==='ns_sleep'){ BABY.state='sleep'; happiness=Math.min(100,happiness+8); }
    happiness=Math.min(100,happiness+6);
    showFlash('✓ '+step.labelEn+' 완료! 🌙');
    nightStep++;
    if(nightStep>=nightRoutine.length){
      nightComplete=true;
      // 30% chance baby wakes up
      if(Math.random()<0.3) setTimeout(()=>{if(!nightComplete)return;babyWoke=true;BABY.state='cry';shake();},3000);
    }
    return;
  }

  // Pick up items
  if(!PLR.carrying){
    for(const [id,it] of Object.entries(ITEMS)){
      if(!it.avail) continue;
      if(dist({x:px2,y:py2},{x:it.x,y:it.y})<INTERACT_RANGE){
        PLR.carrying=id; it.avail=false;
        setTimeout(()=>{it.avail=true;},4000);
        showFlash(it.e+' '+it.name+' 집었어요');
        return;
      }
    }
  }

  // Interact with baby
  const bd=dist({x:px2,y:py2},{x:BABY.x+15,y:BABY.y+15});
  if(bd<INTERACT_RANGE){
    const ev=getEventForChar('baby');
    if(ev){
      if(ev.item===null||(PLR.carrying===ev.item)){
        resolveEvent(ev); return;
      } else if(PLR.carrying&&PLR.carrying!==ev.item){
        showFlash('아기는 '+ITEMS[ev.item]?.e+' '+ITEMS[ev.item]?.name+'이/가 필요해요!');
      } else {
        showFlash('💡 먼저 '+ITEMS[ev.item]?.e+' '+ITEMS[ev.item]?.name+'을 가져오세요!');
      }
    } else {
      BABY.state='happy'; happiness=Math.min(100,happiness+2);
      showFlash('💕 아기와 놀았어요!');
    }
    return;
  }

  // Interact with spouse
  if(SPOUSE.present){
    const sd=dist({x:px2,y:py2},{x:SPOUSE.x+18,y:SPOUSE.y+27});
    if(sd<INTERACT_RANGE){
      const ev=getEventForChar('spouse');
      if(ev){
        if(ev.item===null||(PLR.carrying===ev.item)){
          resolveEvent(ev); return;
        } else {
          showFlash('💡 '+ITEMS[ev.item]?.e+' '+ITEMS[ev.item]?.name+'이 필요해요!');
        }
      } else {
        happiness=Math.min(100,happiness+1);
        showFlash('💕 배우자에게 말 걸었어요!');
      }
      return;
    }
  }

  // Interact with dog
  const dd=dist({x:px2,y:py2},{x:DOG.x+15,y:DOG.y+12});
  if(dd<INTERACT_RANGE){
    const ev=getEventForChar('dog');
    if(ev){
      if(ev.item===null||(PLR.carrying===ev.item)){
        resolveEvent(ev); return;
      } else {
        showFlash('🐕 강아지는 '+ITEMS[ev.item]?.e+' '+ITEMS[ev.item]?.name+'이 필요해요!');
      }
    } else {
      happiness=Math.min(100,happiness+1);
      showFlash('🐕 강아지랑 놀았어요!');
    }
    return;
  }

  // Drop item if pressing A with nothing to interact with
  if(PLR.carrying){
    showFlash('💡 맞는 대상에게 가까이 가서 행동하세요!');
  }
}

function isInRoom(x,y,name){
  const r=RM[name]; return x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h;
}

// ── UPDATE ────────────────────────────────────────
function startGame(){
  gs='play'; gameTime=GAME_START; realElapsed=0; happiness=88;
  PLR.x=620; PLR.y=400; PLR.carrying=null; PLR.dir='down';
  BABY.state='happy'; SPOUSE.present=false;
  activeEvents=[];
  nightRoutine=NIGHT_STEPS.map(s=>({...s,done:false}));
  nightActive=false; nightStep=0; nightComplete=false;
  babyWoke=false; babyWokeHandled=false;
  babyEventT=0; dogEventT=0; spouseEventT=0;
  ITEMS.groceries.avail=false;
  Object.values(ITEMS).forEach(it=>{if(it!==ITEMS.groceries)it.avail=true;});
}
function resetGame(){ gs='select'; }

function update(dt){
  if(gs!=='play') return;
  
  // Time
  realElapsed+=dt;
  gameTime=GAME_START+realElapsed*MINS_PER_SEC;
  if(gameTime>=GAME_END){ gs=nightComplete?'win':'over'; return; }
  
  // Flash
  if(flashT>0)flashT-=dt;
  
  // Shake
  if(shakeT>0){shakeT-=dt;shakeX=(Math.random()-.5)*6;shakeY=(Math.random()-.5)*6;}
  else{shakeX=0;shakeY=0;}
  
  // Spawn baby events
  babyEventT-=dt;
  if(babyEventT<=0){
    spawnEvent(BABY_EVENTS,'baby',2);
    babyEventT=rnd(22,45);
  }
  
  // Spawn dog events
  dogEventT-=dt;
  if(dogEventT<=0){
    spawnEvent(DOG_EVENTS,'dog',1);
    dogEventT=rnd(55,90);
  }
  
  // Spouse arrives
  if(gameTime>=SPOUSE_ARRIVE&&!SPOUSE.present){
    SPOUSE.present=true;
    spouseEventT=0;
    showFlash('🏠 배우자가 귀가했어요!'); shake();
    BABY.state=rndI(0,1)?'cry':'happy';
  }
  
  // Spouse events
  if(SPOUSE.present){
    spouseEventT-=dt;
    if(spouseEventT<=0){
      spawnEvent(SPOUSE_EVENTS,'spouse',1);
      spouseEventT=rnd(18,35);
    }
  }
  
  // Night routine start
  if(gameTime>=NIGHT_START&&!nightActive){ nightActive=true; showFlash('🌙 저녁 루틴을 시작할 시간이에요!'); }
  
  // Win condition
  if(nightComplete&&!babyWoke){ gs='win'; return; }
  if(nightComplete&&babyWoke&&babyWokeHandled&&gameTime>22*60){ gs='win'; return; }
  
  // Update events (timers & expiry)
  for(const ev of activeEvents){
    ev.timer-=dt;
    if(ev.timer<=0){
      happiness=Math.max(0,happiness-ev.loss);
      shake();
      if(ev.character==='baby') BABY.state='cry';
      showFlash('😰 실패! -'+ev.loss);
      if(ev.item==='groceries') ITEMS.groceries.avail=false;
    }
  }
  activeEvents=activeEvents.filter(e=>e.timer>0);
  
  // Baby state idle → happy over time
  BABY.bouncT+=dt;
  if(BABY.state==='happy') BABY.bouncT+=dt*0.3;
  
  // Game over
  if(happiness<=0){ gs='over'; return; }
  
  // Player movement
  let dx=0,dy=0;
  if(K['ArrowLeft'])dx=-1;
  if(K['ArrowRight'])dx=1;
  if(K['ArrowUp'])dy=-1;
  if(K['ArrowDown'])dy=1;
  if(dx!==0&&dy!==0){dx*=0.707;dy*=0.707;}
  if(dx!==0)PLR.dir=dx>0?'right':'left';
  if(dy!==0)PLR.dir=dy>0?'down':'up';
  const nx=PLR.x+dx*PLR.spd*dt;
  const ny=PLR.y+dy*PLR.spd*dt;
  if(isWalkable(nx,PLR.y,PLR.w,PLR.h))PLR.x=nx;
  if(isWalkable(PLR.x,ny,PLR.w,PLR.h))PLR.y=ny;
  if(dx!==0||dy!==0){PLR.ft+=dt;if(PLR.ft>.18){PLR.ft=0;PLR.frame=(PLR.frame+1)%2;}}
  else PLR.frame=0;
  
  // Dog wander
  DOG.restT-=dt;
  if(DOG.restT<=0){
    DOG.restT=rnd(2,5);
    DOG.dir=rndI(0,1)?1:-1;
    DOG.walkT=rnd(1,2.5);
  }
  if(DOG.walkT>0){
    DOG.walkT-=dt;
    const nx2=DOG.x+DOG.dir*60*dt;
    if(isInRoom(nx2,DOG.y,'living')){DOG.x=nx2;}
    else{DOG.dir*=-1;}
    DOG.ft=(DOG.ft||0)+dt;
    if(DOG.ft>.2){DOG.ft=0;DOG.frame=(DOG.frame+1)%2;}
  }
  
  // Spouse wander slowly toward sofa
  if(SPOUSE.present){
    const sx=560, sy=360;
    if(Math.abs(SPOUSE.x-sx)>5){SPOUSE.x+=Math.sign(sx-SPOUSE.x)*25*dt;}
    if(Math.abs(SPOUSE.y-sy)>5){SPOUSE.y+=Math.sign(sy-SPOUSE.y)*25*dt;}
  }
}

// ── RENDER ────────────────────────────────────────
function render(ts){
  if(gs==='select'){renderSelect(ts);return;}
  if(gs==='over'){renderOver();return;}
  if(gs==='win'){renderWin(ts);return;}

  cx.save(); cx.translate(shakeX,shakeY);
  
  drawRooms();
  drawItems();
  
  // Dog
  drawDog(DOG.x,DOG.y,DOG.dir,DOG.frame);
  const dEv=getEventForChar('dog');
  if(dEv) drawCallout(DOG.x+15,DOG.y,dEv,dEv.maxTimer);

  // Baby
  drawBaby(BABY.x,BABY.y,BABY.state,BABY.bouncT);
  const bEv=getEventForChar('baby');
  if(bEv) drawCallout(BABY.x+15,BABY.y-10,bEv,bEv.maxTimer);

  // Spouse
  if(SPOUSE.present){
    drawSpouse(SPOUSE.x,SPOUSE.y,SPOUSE.dir,SPOUSE.frame,
      selectedChar==='father'?'mother':'father');
    const sEv=getEventForChar('spouse');
    if(sEv) drawCallout(SPOUSE.x+18,SPOUSE.y-5,sEv,sEv.maxTimer);
  }
  
  // Player
  if(selectedChar==='father') drawFatherSprite(PLR.x,PLR.y,PLR.dir,PLR.frame,PLR.carrying);
  else drawMotherSprite(PLR.x,PLR.y,PLR.dir,PLR.frame,PLR.carrying);
  
  // Interaction hint
  drawInteractHint();
  
  cx.restore();
  
  drawHUD();
  if(nightActive) drawNightRoutine();
}

function drawInteractHint(){
  const px2=PLR.x+PLR.w/2, py2=PLR.y+PLR.h/2;
  let hint='';
  
  for(const [id,it] of Object.entries(ITEMS)){
    if(!it.avail||PLR.carrying) continue;
    if(dist({x:px2,y:py2},{x:it.x,y:it.y})<INTERACT_RANGE){
      hint=`[A] ${it.e} ${it.name} 집기`;
    }
  }
  if(!hint&&dist({x:px2,y:py2},{x:BABY.x+15,y:BABY.y+15})<INTERACT_RANGE) hint='[A] 아기에게 행동하기';
  if(!hint&&SPOUSE.present&&dist({x:px2,y:py2},{x:SPOUSE.x+18,y:SPOUSE.y+27})<INTERACT_RANGE) hint='[A] 배우자에게 행동하기';
  if(!hint&&dist({x:px2,y:py2},{x:DOG.x+15,y:DOG.y+12})<INTERACT_RANGE) hint='[A] 강아지에게 행동하기';
  
  if(hint){
    cx.font='11px monospace'; cx.fillStyle='rgba(0,0,0,0.6)';
    const tw=cx.measureText(hint).width;
    drawRoundRect(PLR.x+PLR.w/2-tw/2-6,PLR.y-20,tw+12,18,4,'rgba(255,248,220,0.9)');
    cx.fillStyle='#4a3020'; cx.textAlign='center';
    cx.fillText(hint,PLR.x+PLR.w/2,PLR.y-7);
  }
}

  cx.fillText('오전 7시부터 자정까지  •  아기, 강아지, 배우자를 행복하게 • 행복 지수 0이면 실패',W/2,490);
}

function renderOver(){
  const bg=cx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#200010'); bg.addColorStop(1,'#100008');
  cx.fillStyle=bg; cx.fillRect(0,0,W,H);
  cx.textAlign='center';
  cx.font='bold 52px serif'; cx.fillStyle='#ff6060';
  cx.shadowColor='#ff2020'; cx.shadowBlur=30;
  cx.fillText('많이 힘들었죠... 😔',W/2,160);
  cx.shadowBlur=0;
  cx.font='20px serif'; cx.fillStyle='#C09090';
  cx.fillText('Game Over',W/2,205);
  cx.font='14px monospace'; cx.fillStyle='#907070';
  cx.fillText('행복 지수가 0이 되었어요',W/2,245);
  cx.fillText(fmtTime(Math.min(gameTime,GAME_END-1))+'까지 버텼어요',W/2,268);
  cx.fillStyle='#504040'; cx.fillRect(W/2-200,285,400,1);
  cx.font='14px serif'; cx.fillStyle='#B09090';
  cx.fillText('"육아는 세상에서 가장 힘든 일이에요."',W/2,320);
  cx.font='11px monospace'; cx.fillStyle='#705050';
  cx.fillText('"Parenting is the hardest job in the world."',W/2,345);
  if(Math.sin(Date.now()/500)>0){
    cx.font='bold 14px monospace'; cx.fillStyle='#FFD080';
    cx.fillText('[ SPACE — 다시 도전 ]',W/2,415);
  }
}

function renderWin(ts){
  if(winAnimT===0)winAnimT=ts;
  const t=(ts-winAnimT)/1000;
  
  // Dark soft background
  cx.fillStyle='rgba(10,5,20,0.95)'; cx.fillRect(0,0,W,H);
  
  // Confetti
  for(let i=0;i<30;i++){
    const cf=((t*0.3+i*1.3)%1)*W;
    const cy=((t*0.2*(i*0.3+0.5))%1)*H;
    cx.fillStyle=['#FFD080','#F4B8C8','#C8A0B4','#88CCFF','#A0D890'][i%5];
    cx.fillRect(cf,cy,6,6);
  }
  
  // Baby photo (draw directly at high quality)
  if(babyReady){
    cx.save();
    cx.imageSmoothingEnabled=true;
    cx.beginPath(); cx.arc(W/2,180,90,0,Math.PI*2); cx.clip();
    cx.drawImage(babyImg,W/2-90,90,180,180);
    cx.restore();
    // Border glow
    cx.strokeStyle='#FFD080'; cx.lineWidth=4;
    cx.shadowColor='#FFD080'; cx.shadowBlur=20;
    cx.beginPath(); cx.arc(W/2,180,91,0,Math.PI*2); cx.stroke();
    cx.shadowBlur=0;
  }
  
  // Win title
  cx.textAlign='center';
  cx.font='bold 36px serif'; cx.fillStyle='#FFD080';
  cx.shadowColor='#fbbf24'; cx.shadowBlur=20;
  cx.fillText('🎉 하루를 무사히 마쳤어요! 🎉',W/2,310);
  cx.shadowBlur=0;
  
  // Message
  cx.font='bold 18px serif'; cx.fillStyle='#F4B8C8';
  cx.fillText('오늘 하루도 무사히 이겨낸 거 축하해!',W/2,355);
  cx.font='16px serif'; cx.fillStyle='#C8A0B4';
  cx.fillText('매일의 도전을 더 즐겁게 맞이하자.',W/2,382);
  
  cx.fillStyle='rgba(255,255,255,0.1)'; cx.fillRect(W/2-240,398,480,1);
  cx.font='13px monospace'; cx.fillStyle='#9090B0';
  cx.fillText('"Every day with family is a gift."',W/2,422);
  
  if(Math.sin(ts/500)>0){
    cx.font='bold 13px monospace'; cx.fillStyle='#FFD080';
    cx.fillText('[ SPACE — 다시 하기 ]',W/2,470);
  }
}

// ── LOOP ──────────────────────────────────────────
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05); last=ts;
  update(dt); render(ts);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
