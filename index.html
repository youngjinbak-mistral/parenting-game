<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARENTING — keep the family happy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: #0b0b12;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-family: "Press Start 2P", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  }
  #wrap { position: relative; line-height: 0; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; border-radius: 4px;
    box-shadow: 0 0 60px rgba(255, 170, 90, .22), 0 0 0 2px #1c1c2e;
  }
  #scan {
    position: absolute; inset: 0; pointer-events: none; border-radius: 4px;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  /* touch controls: hug the canvas corners, never the play area center */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch button {
    pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: inherit; background: rgba(30,26,50,.55); color: #fff;
    border: 2px solid rgba(255,255,255,.5); border-radius: 10px; opacity: .8;
  }
  #touch button:active { background: rgba(94,234,212,.6); }
  #dpad { position: absolute; left: 2%; bottom: 3%; width: 22%; aspect-ratio: 1; display: grid;
    grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr; gap: 4%; }
  #dpad .up { grid-area: 1/2; } #dpad .left { grid-area: 2/1; } #dpad .right { grid-area: 2/3; } #dpad .down { grid-area: 3/2; }
  #abtns { position: absolute; right: 2%; bottom: 3%; display: flex; gap: 8%; width: 24%; }
  #abtns .abtn { flex: 1; aspect-ratio: 1; font-size: 4.5vmin; border-radius: 50%; }
  /* touch controls only on touch devices; desktop plays with keyboard and keeps stations clear */
  @media (pointer: fine) { #touch { display: none; } }
  #wrap.force #touch { display: block; } /* force-show for testing via ?touch=1 */
  @media (pointer: coarse) { #touch { opacity: .75; } }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="scan"></div>
    <div id="touch">
      <div id="dpad">
        <button class="dbtn up" data-k="ArrowUp">▲</button>
        <button class="dbtn left" data-k="ArrowLeft">◀</button>
        <button class="dbtn right" data-k="ArrowRight">▶</button>
        <button class="dbtn down" data-k="ArrowDown">▼</button>
      </div>
      <div id="abtns">
        <button id="btnA" class="abtn a">A</button>
        <button id="btnS" class="abtn s">S</button>
      </div>
    </div>
  </div>
  <script src="sprites.js"></script>
  <script src="photo.js"></script>
  <script src="game_content.js"></script>
  <script src="game.js"></script>
</body>
</html>
