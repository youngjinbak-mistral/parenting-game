// Walkability: use player feet-center (bottom-center) for natural feel
function isWalkable(px,py,pw,ph){
  const mx = px + (pw||36)/2;
  const my = py + (ph||54) - 10; // near feet
  for(const r of Object.values(RM)){
    const ir=innerRoom(r);
    if(mx>ir.x&&mx<ir.x+ir.w&&my>ir.y&&my<ir.y+ir.h)return true;
  }
  for(const d of DOORWAYS){
    if(mx>d.x&&mx<d.x+d.w&&my>d.y&&my<d.y+d.h)return true;
  }
  return false;
}

// Helper: draw a furniture piece with depth illusion (top view + south shadow edge)
function furn(x,y,w,h,topCol,edgeCol,shadowAlpha=0.22,edgeH=5){
  // Drop shadow
  cx.fillStyle=`rgba(0,0,0,${shadowAlpha})`;
  cx.fillRect(x+edgeH,y+h+edgeH,w,4);
  // Top face
  cx.fillStyle=topCol; cx.fillRect(x,y,w,h);
  // South edge (depth)
  cx.fillStyle=edgeCol; cx.fillRect(x,y+h,w,edgeH);
  // Outline
  cx.strokeStyle='rgba(0,0,0,0.25)'; cx.lineWidth=1;
  cx.strokeRect(x+0.5,y+0.5,w-1,h+edgeH-1);
}

function drawRooms(){
  // 1. Wall base — warm dark brown
  const wallGrad=cx.createLinearGradient(0,UI_H,0,H);
  wallGrad.addColorStop(0,'#5C3D22'); wallGrad.addColorStop(1,'#3A2410');
  cx.fillStyle=wallGrad; cx.fillRect(0,UI_H,W,H-UI_H);
  // Wall texture: subtle vertical grain
  cx.strokeStyle='rgba(0,0,0,0.08)'; cx.lineWidth=1;
  for(let wx=0;wx<W;wx+=18){cx.beginPath();cx.moveTo(wx,UI_H);cx.lineTo(wx,H);cx.stroke();}

  // 2. Per-room floors with gradient + texture
  const ROOM_CFG={
    bathroom:{base:'#EAF4FC',mid:'#D8ECF8',line:'#C0D8EC',lineStep:18,lineDir:'grid'},
    entry:   {base:'#E8DFCA',mid:'#D8CDB4',line:'#C8B898',lineStep:14,lineDir:'h'},
    baby:    {base:'#F8F0FE',mid:'#EEE0F8',line:'#DDD0F0',lineStep:16,lineDir:'h'},
    kitchen: {base:'#EDEAE0',mid:'#E0DDD2',line:'#D0CFC4',lineStep:22,lineDir:'grid'},
    living:  {base:'#DEB070',mid:'#C89848',line:'#B88038',lineStep:12,lineDir:'h'},
  };
  Object.entries(RM).forEach(([name,r])=>{
    const cfg=ROOM_CFG[name];
    const ir=innerRoom(r);
    // Radial gradient floor: lighter center, slightly darker edges
    const fg=cx.createRadialGradient(
      ir.x+ir.w/2,ir.y+ir.h/2,0,
      ir.x+ir.w/2,ir.y+ir.h/2,Math.max(ir.w,ir.h)*0.7
    );
    fg.addColorStop(0,cfg.base); fg.addColorStop(1,cfg.mid);
    cx.fillStyle=fg; cx.fillRect(ir.x,ir.y,ir.w,ir.h);
    // Texture lines
    cx.strokeStyle=cfg.line; cx.lineWidth=1; cx.globalAlpha=0.6;
    if(cfg.lineDir==='grid'||cfg.lineDir==='h'){
      for(let gy=ir.y+cfg.lineStep;gy<ir.y+ir.h;gy+=cfg.lineStep){
        cx.beginPath();cx.moveTo(ir.x,gy);cx.lineTo(ir.x+ir.w,gy);cx.stroke();
      }
    }
    if(cfg.lineDir==='grid'){
      for(let gx=ir.x+cfg.lineStep;gx<ir.x+ir.w;gx+=cfg.lineStep){
        cx.beginPath();cx.moveTo(gx,ir.y);cx.lineTo(gx,ir.y+ir.h);cx.stroke();
      }
    }
    cx.globalAlpha=1;
    // Baseboard (inner wall edge) — lighter strip along all wall edges
    cx.fillStyle='rgba(255,255,255,0.12)';
    cx.fillRect(ir.x,ir.y,ir.w,2); cx.fillRect(ir.x,ir.y,2,ir.h);
    cx.fillStyle='rgba(0,0,0,0.15)';
    cx.fillRect(ir.x,ir.y+ir.h-2,ir.w,2); cx.fillRect(ir.x+ir.w-2,ir.y,2,ir.h);
  });

  // 3. Doorways — blend with adjacent floor, add frame trim
  const DOOR_FILLS={
    0:'#D4E8F2',1:'#B09A6E',2:'#DED8CC',3:'#B09A6E',4:'#C09050',5:'#B88040'
  };
  DOORWAYS.forEach((d,i)=>{
    cx.fillStyle=DOOR_FILLS[i]||'#C0B080'; cx.fillRect(d.x,d.y,d.w,d.h);
    // Door frame trim
    cx.fillStyle='rgba(80,50,20,0.35)';
    if(d.w>d.h){ cx.fillRect(d.x,d.y,d.w,3); cx.fillRect(d.x,d.y+d.h-3,d.w,3); }
    else        { cx.fillRect(d.x,d.y,3,d.h); cx.fillRect(d.x+d.w-3,d.y,3,d.h); }
  });

  // 4. Room labels (subtle)
  const LABELS={baby:'아기방',kitchen:'부엌',living:'거실',bathroom:'욕실',entry:'현관'};
  cx.textAlign='center'; cx.font='bold 11px sans-serif'; cx.globalAlpha=0.18;
  Object.entries(RM).forEach(([name,r])=>{
    cx.fillStyle='#1A0A00';
    cx.fillText(LABELS[name]||'',r.x+r.w/2,r.y+r.h-8);
  });
  cx.globalAlpha=1;

  drawFurniture();
}

function drawItems(){
  cx.font='18px serif'; cx.textAlign='center';
  for(const [id,it] of Object.entries(ITEMS)){
    if(!it.avail) continue;
    // Glow circle
    const gr=cx.createRadialGradient(it.x,it.y,0,it.x,it.y,16);
    gr.addColorStop(0,'rgba(255,255,255,0.4)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle=gr; cx.beginPath(); cx.arc(it.x,it.y,16,0,Math.PI*2); cx.fill();
    cx.fillText(it.e,it.x,it.y+6);
  }
}

function drawBaby(x,y,state,bouncT){
  const bob=Math.sin(bouncT*3)*2;
  const bx=x,by=y+bob;
  // Body (onesie)
  cx.fillStyle=PAL.baby.onesie; cx.beginPath(); cx.ellipse(bx+15,by+22,14,16,0,0,Math.PI*2); cx.fill();
  // Head
  cx.fillStyle=PAL.baby.skin; cx.beginPath(); cx.ellipse(bx+15,by+10,13,13,0,0,Math.PI*2); cx.fill();
  // Cheeks
  cx.fillStyle=PAL.baby.cheeks+'88';
  cx.beginPath();cx.ellipse(bx+6,by+13,5,4,0,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(bx+24,by+13,5,4,0,0,Math.PI*2);cx.fill();
  // Hair (wispy)
  cx.fillStyle=PAL.baby.hair;
  for(let i=0;i<4;i++){cx.fillRect(bx+8+i*3,by,2,4+Math.sin(i)*2);}
  // Eyes & expression
  if(state==='cry'){
    cx.fillStyle='#333'; cx.fillRect(bx+8,by+10,3,3); cx.fillRect(bx+19,by+10,3,3);
    cx.font='8px serif'; cx.textAlign='center';
    cx.fillStyle='#4488ff';
    cx.fillText('😢',bx+15,by+22);
    // Tears
    cx.fillStyle='#88aaff';
    cx.fillRect(bx+9,by+13,2,5); cx.fillRect(bx+20,by+13,2,5);
  } else if(state==='sleep'){
    cx.fillStyle='#555'; cx.fillRect(bx+8,by+11,5,2); cx.fillRect(bx+18,by+11,5,2);
    cx.font='10px serif'; cx.textAlign='left'; cx.fillText('z z',bx+28,by+5);
  } else {
    // Happy
    cx.fillStyle='#333'; cx.fillRect(bx+8,by+10,3,3); cx.fillRect(bx+19,by+10,3,3);
    cx.fillStyle='#333';
    cx.beginPath();cx.arc(bx+15,by+16,4,0.1,Math.PI-0.1);cx.stroke();
  }
  // Arms reaching out
  if(state==='cry'){
    cx.fillStyle=PAL.baby.skin;
    cx.fillRect(bx,by+20,8,5); cx.fillRect(bx+22,by+20,8,5);
  }
}

  cx.beginPath(); cx.ellipse(26,8,8,7,0.3,0,Math.PI*2); cx.fill();

  cx.fillStyle=PAL.dog.ears;
